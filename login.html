<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PharmacoPilot · 登录</title>
<meta name="description" content="PharmacoPilot 登录入口（演示版本无需登录即可浏览全部页面）。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a8492a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='30' font-family='Georgia' font-style='italic' fill='%23fffdf7'%3EP%3C/text%3E%3C/svg%3E" />
<!-- 字体:preconnect + 非阻塞加载(media=print onload),消除原 tokens.css @import 的渲染阻塞 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap"></noscript>
<link rel="stylesheet" href="./shared/tokens.css?v=8-motion-tokens" />
<link rel="stylesheet" href="./shared/bc-chrome.css?v=24-status-strip-removed" />
<style>
body { background: var(--paper); color: var(--ink); font-family: var(--sans); margin: 0; }

.login-wrap {
  min-height: calc(100vh - 200px);
  display: flex; align-items: center; justify-content: center;
  padding: 80px 24px;
}

.login-card {
  width: 100%; max-width: 420px;
  background: var(--ivory);
  border: 1px solid var(--ink);
  border-radius: 16px;
  padding: 40px 36px;
}

.login-eyebrow {
  font-family: var(--mono); font-size: var(--fs-2xs); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--amber-deep);
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.login-eyebrow::before {
  content: ""; width: 20px; height: 1px; background: var(--amber-deep);
}

.login-card h1 {
  font-family: var(--serif-cn); font-weight: 500;
  font-size: var(--fs-3xl); line-height: 1.2; margin: 0 0 12px;
  color: var(--ink);
}
.login-card h1 .it {
  font-family: var(--serif-en); font-style: italic; font-weight: 500;
  color: var(--amber-deep);
}

.login-card p {
  font-size: var(--fs-sm); line-height: 1.7; color: var(--mute);
  margin: 0 0 28px;
}
.login-card p.login-fullname {
  font-family: var(--mono); font-size: var(--fs-2xs); color: var(--amber-deep);
  letter-spacing: 0.02em; margin: -10px 0 18px;
}

.login-field {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 16px;
}
.login-field label {
  font-family: var(--mono); font-size: var(--fs-2xs); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute);
}
.login-field input {
  padding: 12px 14px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--paper-2);
  font: inherit; color: var(--ink);
  outline: 0;
  transition: border-color .18s, background .18s, box-shadow .18s;
}
.login-field input:focus {
  border-color: var(--amber-deep);
  background: var(--ivory);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--amber-deep) 14%, transparent);
}
.login-field input:disabled {
  cursor: not-allowed; opacity: 0.6;
}

.login-actions {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 24px;
}
.login-actions .pill-cap { justify-content: center; }
.login-actions .pill-cap.fill[disabled] {
  opacity: 0.55; cursor: not-allowed; pointer-events: none;
}

.login-note {
  margin-top: 22px; padding-top: 18px;
  border-top: 1px dashed var(--rule);
  font-family: var(--mono); font-size: var(--fs-2xs); line-height: 1.6;
  color: var(--mute);
}
.login-note b { color: var(--amber-deep); font-weight: 500; }

.login-back {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px;
  font-size: var(--fs-xs); color: var(--ink-soft); text-decoration: none;
}
.login-back:hover { color: var(--amber-deep); }
</style>
</head>
<body>

<!-- ===== Masthead ===== -->
<header class="masthead">
  <div class="masthead-inner">
    <a class="mast-brand" href="./index.html">
      <span class="logo">Pharmaco<span class="it">Pilot</span></span>
      <span class="ed">for Pharmacy Education</span>
    </a>
    <div class="app-tabs">
      <a href="./index.html">概览</a>
      <a href="./nav-detail.html">教学导航 <kbd>1</kbd></a>
      <a href="./practice-detail.html">教学实践 <kbd>2</kbd></a>
      <a href="./data-detail.html">教学数据 <kbd>3</kbd></a>
    </div>
    <div class="cmdbar">⌕ 搜索 <kbd>⌘K</kbd></div>
    <div class="mast-actions">
      <a class="pill-cap fill" href="./nav-detail.html">进入工作台 →</a>
    </div>
  </div>
</header>

<main class="login-wrap">
  <div class="login-card">
    <div class="login-eyebrow">用户账户</div>
    <h1>登录<span class="it">PharmacoPilot</span></h1>
    <p class="login-fullname">全生命周期赋能药学类课程教学智能体 · PharmacoPilot for Pharmacy Education</p>
    <p>登录后，你的研究入口、训练地图与课堂沉淀将自动同步到本机工作台。</p>

    <form onsubmit="event.preventDefault();">
      <div class="login-field">
        <label for="login-email">邮箱</label>
        <input id="login-email" type="email" placeholder="you@school.edu.cn" disabled />
      </div>
      <div class="login-field">
        <label for="login-pass">密码</label>
        <input id="login-pass" type="password" placeholder="••••••••" disabled />
      </div>

      <div class="login-actions">
        <button type="submit" class="pill-cap fill" disabled>登录 →</button>
        <a class="pill-cap ghost" href="./index.html" style="justify-content:center;">返回概览</a>
      </div>
    </form>

    <div class="login-note">
      <b>·</b> 登录系统正在接入中。当前版本以演示为主，所有页面无需登录即可浏览。
    </div>
  </div>
</main>

</body>
</html>
