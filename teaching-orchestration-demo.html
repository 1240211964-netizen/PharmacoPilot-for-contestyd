<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/shared/tokens.css"><title>CH06 编排演示</title>
<style>body{max-width:900px;margin:40px auto;padding:0 20px;font:var(--text-body)/var(--lh-body) var(--sans);color:var(--ink);background:var(--paper)}button{padding:10px 16px;border:0;border-radius:var(--r-sm);background:var(--amber-deep);color:var(--ivory);font-weight:700;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:var(--ivory);border:1px solid var(--rule-2);padding:16px;border-radius:var(--r-md)}#summary{margin:16px 0;padding:14px;background:var(--amber-wash);border-left:4px solid var(--amber-deep)}</style>
<main><h1>运行 CH06 编排演示</h1><p>这是确定性 fixture 验证，不使用课程知识库正文、LLM 或真实教师裁决。</p><label>随机种子 <input id="seed" value="ch06-demo-001"></label> <button id="run">运行演示</button><section id="summary" hidden></section><details id="timeline" hidden><summary>查看状态时间线</summary><pre></pre></details></main>
<script type="module">const run=document.querySelector('#run'),seed=document.querySelector('#seed'),summary=document.querySelector('#summary'),timeline=document.querySelector('#timeline'),pre=timeline.querySelector('pre');run.onclick=async()=>{run.disabled=true;summary.hidden=false;summary.textContent='正在运行…';try{const r=await fetch('/api/product-core/teaching-orchestration/demo/ch06/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({seed:seed.value})});const x=await r.json();if(!r.ok)throw new Error(x.error?.message||'运行失败');summary.innerHTML=`工作流：${x.workflowInstanceId}<br>状态：${x.status}<br>版本链：${x.teachingDesignV1Id} → ${x.simulationRunId} → ${x.teachingDesignV2Id} → ${x.s9AssetCandidateId}<br>关键时刻：${x.criticalMomentCount}`;const d=await fetch('/api/product-core/teaching-orchestration/workflows/'+x.workflowInstanceId).then(r=>r.json());pre.textContent=JSON.stringify(d.transitions,null,2);timeline.hidden=false}catch(e){summary.textContent=e.message}finally{run.disabled=false}};</script></html>
