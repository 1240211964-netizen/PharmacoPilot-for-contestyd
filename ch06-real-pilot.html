<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/shared/tokens.css"><title>CH06 真实教学设计试点</title>
<style>body{max-width:1080px;margin:32px auto;padding:0 20px;font:var(--text-body)/var(--lh-body) var(--sans);color:var(--ink);background:var(--paper)}button,input,textarea{font:inherit;padding:8px}button{cursor:pointer;margin:4px}.panel{padding:18px;margin:16px 0;background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-md)}.stage{border-left:4px solid var(--amber-deep);padding:14px;margin:14px 0;background:var(--ivory)}.meta{color:var(--ink-2);font-size:var(--fs-xs)}textarea{display:block;width:100%;min-height:130px;box-sizing:border-box}.warn{color:var(--amber-deep)}pre{white-space:pre-wrap;overflow:auto;background:var(--ivory);padding:12px}.hidden{display:none}</style>
<main><h1>CH06 真实教学设计试点</h1><p>本页只把获授权的 CH06 最小证据片段交给本地模型。S1 是明确标记的模拟学情；S2—S7 是本地模型候选，必须由教师逐项裁决后才会进入仿真。</p>
<section class="panel"><label>教师 ID <input id="actor" value="teacher-local-review"></label><label> seed <input id="seed" value="ch06-real-pilot-001"></label><button id="run">生成 S2—S7 候选</button><p id="status" class="meta"></p></section>
<section id="workflow" class="hidden"><div class="panel"><h2>版本链</h2><p id="chain"></p><p id="gaps" class="warn"></p><button id="complete">生成教学设计 v1 并运行虚拟课堂</button></div><div id="stages"></div><details class="panel"><summary>状态时间线与原始记录</summary><pre id="raw"></pre></details></section></main>
<script type="module">
const $=s=>document.querySelector(s), api='/api/product-core/teaching-orchestration';let workflowId=null, detail=null;
function json(v){try{return JSON.parse(v)}catch{return v}}
function stageCard(stage,payload,candidate){const items=payload.items||[];const ev=payload.inputEvidenceLinkIds||[];return `<section class="panel stage"><h2>${stage}</h2><p class="meta">模型：${payload.modelProfile||'—'}；提示词：${payload.promptVersion||'—'}；检索：${payload.retrievalRunId||'—'}</p>${items.map((x,i)=>`<article><h3>${x.title||'候选项 '+(i+1)}</h3><p>${x.content||''}</p><p class="meta">${x.claimType||''} · evidence: ${(x.evidenceLinkIds||[]).join(', ')||'无'} · chunks: ${(x.chunkIds||[]).join(', ')||'无'}</p><p class="meta">来源：${(x.citations||[]).map(c=>`${c.sourceFile}，${c.pageOrSlide}`).join('；')||'无（教学建议或待补证据）'}</p></article>`).join('')}<label>裁决理由 <input data-reason="${stage}" value="教师已核对候选与引用"></label><textarea data-edit="${stage}" aria-label="${stage} 修改内容">${JSON.stringify(payload,null,2)}</textarea><div><button data-decision="ACCEPTED" data-stage="${stage}">采纳</button><button data-decision="MODIFIED" data-stage="${stage}">修改后采纳</button><button data-decision="REJECTED" data-stage="${stage}">驳回</button><button data-decision="PENDING_EVIDENCE" data-stage="${stage}">待补证据</button></div><p class="meta">此项可用 evidence links：${ev.join(', ')}</p></section>`}
function render(d){detail=d;workflowId=d.workflow.id;$('#workflow').classList.remove('hidden');const candidate=d.candidates.at(-1), body=json(candidate.payload_json), stages=body.stages||{};$('#status').textContent=`工作流 ${workflowId}：${d.workflow.current_state}`;$('#stages').innerHTML=Object.entries(stages).map(([stage,p])=>stageCard(stage,p,candidate)).join('');const versions=d.designVersions||[],sim=d.simulationRuns||[],s9=d.s9Candidates||[];$('#chain').textContent=`design v1：${versions.find(x=>x.version_number===1)?.id||'待教师批准'} → simulation：${sim[0]?.id||'待运行'} → design v2：${versions.find(x=>x.version_number===2)?.id||'待生成'} → S9 candidate：${s9[0]?.id||'待生成'}；关键时刻：${(d.criticalMoments||[]).length}`;const allGaps=Object.values(stages).flatMap(x=>x.evidenceGaps||[]);$('#gaps').textContent=allGaps.length?`证据缺口：${allGaps.join('；')}`:'证据缺口：模型未报告；教师仍须核对。';$('#raw').textContent=JSON.stringify(d,null,2);document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=submitDecision);$('#complete').onclick=complete}
async function load(id){const r=await fetch(`${api}/workflows/${id}`);if(!r.ok)throw new Error((await r.json()).error?.message||'读取失败');render(await r.json())}
async function submitDecision(e){const b=e.currentTarget, stage=b.dataset.stage, body=json(detail.candidates.at(-1).payload_json), original=body.stages[stage], edit=document.querySelector(`[data-edit="${stage}"]`).value;let revisedContent=null;if(b.dataset.decision==='MODIFIED'){try{revisedContent=JSON.parse(edit)}catch{alert('修改内容必须是 JSON');return}}const reason=document.querySelector(`[data-reason="${stage}"]`).value;const r=await fetch(`${api}/workflows/${workflowId}/teacher-decisions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actorId:$('#actor').value,candidateId:detail.candidates.at(-1).id,fieldPath:`/stages/${stage}`,decision:b.dataset.decision,originalContent:original,revisedContent,reason,evidenceLinkIds:original.inputEvidenceLinkIds||[],idempotencyKey:`manual:${workflowId}:${stage}:${Date.now()}`})});if(!r.ok){alert((await r.json()).error?.message||'保存失败');return}await load(workflowId)}
async function complete(){const r=await fetch(`${api}/workflows/${workflowId}/complete-real-pilot`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actorId:$('#actor').value,seed:$('#seed').value})});const x=await r.json();if(!r.ok){alert(x.error?.message||'尚不能完成');return}await load(workflowId)}
$('#run').onclick=async()=>{const b=$('#run');b.disabled=true;$('#status').textContent='正在调用本地模型，逐节点生成…';try{const r=await fetch(`${api}/ch06/run`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({seed:$('#seed').value,generationMode:'local_model',s1ContextMode:'simulated_fixture'})});const x=await r.json();if(!r.ok)throw new Error(x.error?.message||'生成失败');await load(x.workflowInstanceId)}catch(e){$('#status').textContent=e.message}finally{b.disabled=false}};
const initialWorkflowId=new URLSearchParams(location.search).get('workflowId');if(initialWorkflowId)load(initialWorkflowId).catch(error=>{$('#status').textContent=error.message});
</script></html>
