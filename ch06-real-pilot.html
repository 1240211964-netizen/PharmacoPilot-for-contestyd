<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="/shared/tokens.css"><title>CH06 真实教学设计试点</title>
<style>body{max-width:1080px;margin:32px auto;padding:0 20px;font:var(--text-body)/var(--lh-body) var(--sans);color:var(--ink);background:var(--paper)}button,input,textarea{font:inherit;padding:8px}button{cursor:pointer;margin:4px}.panel{padding:18px;margin:16px 0;background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-md)}.stage{border-left:4px solid var(--amber-deep);padding:14px;margin:14px 0;background:var(--ivory)}.meta{color:var(--ink-2);font-size:var(--fs-xs)}textarea{display:block;width:100%;min-height:130px;box-sizing:border-box}.warn{color:var(--amber-deep)}pre{white-space:pre-wrap;overflow:auto;background:var(--ivory);padding:12px}.revision{border-left:4px solid var(--ok)}.revision-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.revision-card{padding:12px;background:var(--ivory);border:1px solid var(--rule-2);border-radius:var(--r-sm)}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--ivory);font-size:var(--fs-xs)}.hidden{display:none}</style>
<main><h1>CH06 真实教学设计试点</h1><p>本页只把获授权的 CH06 最小证据片段交给本地模型。S1 是明确标记的模拟学情；S2—S7 是本地模型候选，必须由教师逐项裁决后才会进入仿真。</p>
<section class="panel"><label>教师 ID <input id="actor" value="teacher-local-review"></label><label> seed <input id="seed" value="ch06-real-pilot-001"></label><button id="run">生成 S2—S7 候选</button><p id="status" class="meta"></p></section>
<section id="workflow" class="hidden"><div class="panel"><h2>版本链</h2><p id="chain"></p><p id="gaps" class="warn"></p><button id="complete">生成教学设计 v1 并运行虚拟课堂</button></div><section id="revision" class="panel revision hidden"><h2>仿真驱动修订</h2><p id="noop"></p><div id="moments" class="revision-grid"></div><div id="diffs"></div><p id="new-s9" class="meta"></p><button id="apply-revision">应用两个关键时刻修订</button></section><div id="stages"></div><details class="panel"><summary>状态时间线与原始记录</summary><pre id="raw"></pre></details></section></main>
<script type="module">
const $=s=>document.querySelector(s), api='/api/product-core/teaching-orchestration';let workflowId=null, detail=null;
function json(v){try{return JSON.parse(v)}catch{return v}}
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function stageCard(stage,payload,candidate){const items=payload.items||[];const ev=payload.inputEvidenceLinkIds||[];return `<section class="panel stage"><h2>${stage}</h2><p class="meta">模型：${payload.modelProfile||'—'}；提示词：${payload.promptVersion||'—'}；检索：${payload.retrievalRunId||'—'}</p>${items.map((x,i)=>`<article><h3>${x.title||'候选项 '+(i+1)}</h3><p>${x.content||''}</p><p class="meta">${x.claimType||''} · evidence: ${(x.evidenceLinkIds||[]).join(', ')||'无'} · chunks: ${(x.chunkIds||[]).join(', ')||'无'}</p><p class="meta">来源：${(x.citations||[]).map(c=>`${c.sourceFile}，${c.pageOrSlide}`).join('；')||'无（教学建议或待补证据）'}</p></article>`).join('')}<label>裁决理由 <input data-reason="${stage}" value="教师已核对候选与引用"></label><textarea data-edit="${stage}" aria-label="${stage} 修改内容">${JSON.stringify(payload,null,2)}</textarea><div><button data-decision="ACCEPTED" data-stage="${stage}">采纳</button><button data-decision="MODIFIED" data-stage="${stage}">修改后采纳</button><button data-decision="REJECTED" data-stage="${stage}">驳回</button><button data-decision="PENDING_EVIDENCE" data-stage="${stage}">待补证据</button></div><p class="meta">此项可用 evidence links：${ev.join(', ')}</p></section>`}
function renderRevision(d){const versions=d.designVersions||[],noOp=versions.find(x=>x.revisionOutcome==='NO_OP'),effective=versions.find(x=>x.effectiveRevision===true),s8=(d.s8Revisions||[]).find(x=>x.effectiveRevision===true),newS9=(d.s9Candidates||[]).find(x=>x.design_version_id===effective?.id);const show=d.workflow.current_state==='COMPLETED'||s8;$('#revision').classList.toggle('hidden',!show);if(!show)return;$('#noop').innerHTML=noOp?`<span class="badge">旧 v${noOp.version_number}</span> ${esc(noOp.id)}：未形成正文变化`:'未检测到旧 no-op 版本。';$('#moments').innerHTML=(d.criticalMoments||[]).map(m=>`<article class="revision-card"><strong>${esc(m.related_stage)} · ${esc(m.moment_type)}</strong><p>${esc(m.reason)}</p><p class="meta">${esc(m.id)}</p></article>`).join('');$('#diffs').innerHTML=s8?`<h3>实际正文变化</h3>${(s8.changedFields||[]).map(c=>`<article class="revision-card"><strong>${esc(c.stage)} · ${esc(c.fieldPath)}</strong><p>${esc(c.reason)}</p><p class="meta">关键时刻：${esc(c.criticalMomentId)}</p><details><summary>查看修改前 / 后</summary><h4>修改前</h4><pre>${esc(JSON.stringify(c.before,null,2))}</pre><h4>修改后</h4><pre>${esc(JSON.stringify(c.after,null,2))}</pre></details></article>`).join('')}`:'<p class="warn">尚未应用有效正文修订。</p>';$('#new-s9').textContent=effective?`仿真驱动修订版：v${effective.version_number} ${effective.id}；新 S9 candidate：${newS9?.id||'待生成'}`:'尚无仿真驱动修订版。';$('#apply-revision').classList.toggle('hidden',Boolean(effective));}
function render(d){detail=d;workflowId=d.workflow.id;$('#workflow').classList.remove('hidden');const candidate=d.candidates.at(-1), body=json(candidate.payload_json), stages=body.stages||{};$('#status').textContent=`工作流 ${workflowId}：${d.workflow.current_state}`;$('#stages').innerHTML=Object.entries(stages).map(([stage,p])=>stageCard(stage,p,candidate)).join('');const versions=d.designVersions||[],sim=d.simulationRuns||[],s9=d.s9Candidates||[],versionText=versions.map(v=>`v${v.version_number}：${v.id}${v.revisionOutcome==='NO_OP'?'（未形成正文变化）':v.effectiveRevision?'（仿真驱动修订版）':''}`).join(' → ');$('#chain').textContent=`${versionText||'design v1：待教师批准'} → simulation：${sim[0]?.id||'待运行'} → S9 candidate：${s9.at(-1)?.id||'待生成'}；关键时刻：${(d.criticalMoments||[]).length}`;const allGaps=Object.values(stages).flatMap(x=>x.evidenceGaps||[]);$('#gaps').textContent=allGaps.length?`证据缺口：${allGaps.map(x=>typeof x==='string'?x:x.description).join('；')}`:'证据缺口：模型未报告；教师仍须核对。';$('#raw').textContent=JSON.stringify(d,null,2);document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=submitDecision);$('#complete').onclick=complete;$('#complete').classList.toggle('hidden',!['TEACHER_REVIEW_PENDING','TEACHER_REVIEW_IN_PROGRESS'].includes(d.workflow.current_state));renderRevision(d)}
async function load(id){const r=await fetch(`${api}/workflows/${id}`);if(!r.ok)throw new Error((await r.json()).error?.message||'读取失败');render(await r.json())}
async function submitDecision(e){const b=e.currentTarget, stage=b.dataset.stage, body=json(detail.candidates.at(-1).payload_json), original=body.stages[stage], edit=document.querySelector(`[data-edit="${stage}"]`).value;let revisedContent=null;if(b.dataset.decision==='MODIFIED'){try{revisedContent=JSON.parse(edit)}catch{alert('修改内容必须是 JSON');return}}const reason=document.querySelector(`[data-reason="${stage}"]`).value;const r=await fetch(`${api}/workflows/${workflowId}/teacher-decisions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actorId:$('#actor').value,candidateId:detail.candidates.at(-1).id,fieldPath:`/stages/${stage}`,decision:b.dataset.decision,originalContent:original,revisedContent,reason,evidenceLinkIds:original.inputEvidenceLinkIds||[],idempotencyKey:`manual:${workflowId}:${stage}:${Date.now()}`})});if(!r.ok){alert((await r.json()).error?.message||'保存失败');return}await load(workflowId)}
async function complete(){const r=await fetch(`${api}/workflows/${workflowId}/complete-real-pilot`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actorId:$('#actor').value,seed:$('#seed').value})});const x=await r.json();if(!r.ok){alert(x.error?.message||'尚不能完成');return}await load(workflowId)}
async function applyRevision(){const r=await fetch(`${api}/workflows/${workflowId}/effective-revision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({actorId:$('#actor').value})});const x=await r.json();if(!r.ok){alert(x.error?.message||'修订应用失败');return}await load(workflowId)}
$('#run').onclick=async()=>{const b=$('#run');b.disabled=true;$('#status').textContent='正在调用本地模型，逐节点生成…';try{const r=await fetch(`${api}/ch06/run`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({seed:$('#seed').value,generationMode:'local_model',s1ContextMode:'simulated_fixture'})});const x=await r.json();if(!r.ok)throw new Error(x.error?.message||'生成失败');await load(x.workflowInstanceId)}catch(e){$('#status').textContent=e.message}finally{b.disabled=false}};
const initialWorkflowId=new URLSearchParams(location.search).get('workflowId');if(initialWorkflowId)load(initialWorkflowId).catch(error=>{$('#status').textContent=error.message});
$('#apply-revision').onclick=applyRevision;
</script></html>
